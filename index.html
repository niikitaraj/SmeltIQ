    function SmeltIQApp() {

          const saved = localStorage.getItem('smeltiq_user');

      const [blacklist, setBlacklist] = useState(() => {
        try {
          const saved = localStorage.getItem('smeltiq_blacklist');
          return saved ? JSON.parse(saved) : INITIAL_BLACKLIST;
        } catch {
          return INITIAL_BLACKLIST;
        }
      });
      const [blacklistSearch, setBlacklistSearch] = useState('');
      const [isAddBlacklistOpen, setIsAddBlacklistOpen] = useState(false);
      const [newBlkPlate, setNewBlkPlate] = useState('');
      const [newBlkVendor, setNewBlkVendor] = useState('Defunct Southern Roadways');
      const [newBlkReason, setNewBlkReason] = useState('');

      // Operational Controls
      const [showVirtualKeyboard, setShowVirtualKeyboard] = useState(false);
      const [sopTab, setSopTab] = useState('EXPIRED_CERT');
      const [sopAlert, setSopAlert] = useState(null);

      const [movementType, setMovementType] = useState('ENTRY');
      const [vehicleNumber, setVehicleNumber] = useState('AP31TJ9988');
      const [selectedVendorCode, setSelectedVendorCode] = useState('VEND-TATALOG-01');
      const [ocrConfidence, setOcrConfidence] = useState(96.4);

      // Camera State
      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState(null);
      const [isScanning, setIsScanning] = useState(false);

      // Decisions & Movements Logs
      const [decision, setDecision] = useState(null);
      const [movements, setMovements] = useState(INITIAL_MOVEMENTS);

      // Modals
      const [isOverrideOpen, setIsOverrideOpen] = useState(false);
      const [overridePin, setOverridePin] = useState('SUPER88');
      const [overrideReason, setOverrideReason] = useState('');
      const [overrideError, setOverrideError] = useState(null);
      const [isSupervisorDeskOpen, setIsSupervisorDeskOpen] = useState(false);

      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const fileInputRef = useRef(null);

      // Clock
      useEffect(() => {
        const timer = setInterval(() => {
          setTime(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }, 1000);
        setTime(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        return () => clearInterval(timer);
      }, []);

      // Blacklist persistence
      useEffect(() => {
        try {
          localStorage.setItem('smeltiq_blacklist', JSON.stringify(blacklist));
        } catch (e) {}
      }, [blacklist]);

      // Close drawer on Escape
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isSidebarOpenMobile) {
            setIsSidebarOpenMobile(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isSidebarOpenMobile]);

      // WebCam stream control
      const startCamera = async () => {
        setCameraError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setCameraActive(true);
        } catch (err) {
          console.warn('Physical camera unavailable:', err);
          setCameraActive(true);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setCameraActive(false);
      };

      const captureFrame = () => {
        setIsScanning(true);
        setTimeout(() => {
          setIsScanning(false);
        }, 600);
      };

      // Statutory Rules Engine
      const evaluateCompliance = (plate, vendorCode, scenario) => {
        const upperPlate = (plate || '').toUpperCase().trim().replace(/\s+/g, '');
        const vendor = vendors.find(v => v.vendor_code === vendorCode);
        const isVendorActive = vendor ? vendor.is_active : false;

        const isBlacklisted = blacklist.some(b => b.vehicle_number.toUpperCase().replace(/\s+/g, '') === upperPlate);
        const blkRecord = blacklist.find(b => b.vehicle_number.toUpperCase().replace(/\s+/g, '') === upperPlate);

        let rc_status = 'ACTIVE';
        let puc_status = 'VALID';
        let puc_valid_until = '2027-02-15';
        let owner_name = 'TATA STEEL SUPPLY CHAIN LOGISTICS';
        let vehicle_class = 'Multi-Axle Heavy Goods Trailer';
        let insurance_upto = '2027-05-30';

        if (upperPlate === 'MH34CC0820' || upperPlate.includes('MH34CC')) {
          puc_status = 'EXPIRED';
          puc_valid_until = '2026-07-03';
          owner_name = 'Omesh Tikaram Bansod';
          vehicle_class = 'M-Cycle/Scooter(2WN)';
          insurance_upto = '2027-07-18';
        } else if (scenario === 'EXPIRED_PUC' || upperPlate.includes('5678')) {
          puc_status = 'EXPIRED';
          puc_valid_until = '2026-09-30';
          owner_name = 'SURESH TRUCKING CO.';
          vehicle_class = 'Heavy Slag Tipper Carrier';
        } else if (scenario === 'SUSPENDED_RC' || upperPlate.includes('0001')) {
          rc_status = 'SUSPENDED';
          puc_valid_until = '2027-01-10';
          owner_name = 'VIJAYAWADA ROADWAYS LTD';
          vehicle_class = 'Iron Ore Dumper (Tri-Axle)';
        } else if (scenario === 'BLACKLISTED' || isBlacklisted) {
          owner_name = blkRecord?.vendor_name || 'DEFUNCT TRANSPORTER';
          rc_status = 'INACTIVE';
          puc_status = 'EXPIRED';
          puc_valid_until = '2026-08-11';
        } else if (scenario === 'NOT_FOUND' || upperPlate.includes('0000')) {
          rc_status = 'NOT_FOUND';
          owner_name = 'UNKNOWN / NOT REGISTERED';
          puc_status = 'NOT_FOUND';
          puc_valid_until = 'N/A';
        }

        const rejection_reasons = [];

        // Rule 0: Watchlist & Blacklist Interlock
        if (isBlacklisted || scenario === 'BLACKLISTED') {
          rejection_reasons.push(
            `CRITICAL SECURITY ALERT: Vehicle is Blacklisted. Reason: "${blkRecord?.blacklisted_reason || 'Barred under plant safety protocol'}"`
          );
        }

        // Rule 1: Vehicle RC Status === ACTIVE
        if (rc_status !== 'ACTIVE') {
          rejection_reasons.push(`Vehicle Registration Certificate (RC) status is ${rc_status} (expected ACTIVE)`);
        }

        // Rule 2: Vehicle PUC Certificate Valid
        if (puc_status !== 'VALID') {
          rejection_reasons.push(`Pollution Under Control (PUC) certificate expired on ${puc_valid_until}`);
        }

        // Rule 3: Vendor Status Active
        if (!isVendorActive) {
          rejection_reasons.push(`Vendor '${vendor?.vendor_name || vendorCode}' is deactivated or barred in plant master registry`);
        }

        const compliance_status = rejection_reasons.length === 0 ? 'ALLOWED' : 'DENIED';

        return {
          id: 'mov-' + Date.now(),
          movement_id: 'mov-' + Math.random().toString(36).substring(2, 9),
          gate_id: activeGate,
          movement_type: movementType,
          vehicle_number: upperPlate,
          ocr_confidence: ocrConfidence,
          owner_name: owner_name,
          vendor_code: vendorCode,
          vendor_name: vendor?.vendor_name || 'Generic Plant Transporter',
          rc_status: rc_status,
          puc_valid_until: puc_valid_until,
          puc_status: puc_status,
          vehicle_class: vehicle_class,
          insurance_upto: insurance_upto,
          is_vendor_active: isVendorActive,
          is_blacklisted: isBlacklisted,
          compliance_status: compliance_status,
          rejection_reasons: rejection_reasons,
          guard_id: currentUser ? currentUser.employee_id : 'GUARD-8812',
          created_at: new Date().toISOString()
        };
      };

      const executeVerification = async (plate, vendorCode) => {
        const cleanPlate = (plate || '').toUpperCase().trim().replace(/[^A-Z0-9]/g, '');
        if (!cleanPlate) {
          alert('Please enter a vehicle license plate number.');
          return;
        }

        setIsScanning(true);

        try {
          const res = await fetch('http://localhost:8000/api/v1/gate/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              vehicle_number: cleanPlate,
              expected_vendor_code: vendorCode || selectedVendorCode || 'VEND-TATALOG-01',
              guard_id: currentUser ? currentUser.employee_id : 'GUARD-8812',
              gate_id: activeGate || 'Gate 01 - North Material Entrance',
              movement_type: movementType || 'ENTRY',
              ocr_confidence: ocrConfidence || 98.5,
              force_refresh: false
            })
          });

          if (res.ok) {
            const apiResult = await res.json();
            setDecision(apiResult);
            setMovements(prev => [apiResult, ...prev]);
            setIsScanning(false);
            if (apiResult.compliance_status === 'DENIED' && (apiResult.rejection_reasons || []).some(r => r.includes('Blacklist') || r.includes('Watchlist'))) {
              setSopAlert(`🚨 SECURITY ALERT: Blacklisted vehicle ${apiResult.vehicle_number} detected! Barrier Locked. Detain in Bay 3.`);
            }
            return;
          } else {
            let errDetail = `Server returned HTTP ${res.status}`;
            try {
              const errJson = await res.json();
              errDetail = errJson.detail || errJson.message || JSON.stringify(errJson);
            } catch (e) {
              errDetail = await res.text();
            }
            setIsScanning(false);

                </div>

              {/* ========================================================= */}
              {/* PAGE 5: PLANT SAFETY SOP & HELP GUIDE                     */}
              {/* ========================================================= */}
              {activePage === 'SAFETY_SOP' && (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-6">
                  <div>
                    <h2 className="text-base font-bold text-slate-900 flex items-center space-x-2">
                      <Icons.BookOpen />
                      <span>Vizag Steel Plant Safety Standard Operating Procedures (SOP)</span>
                    </h2>
                    <p className="text-xs text-slate-500">
                      Standard operating guidelines and mandatory compliance protocols for gate security personnel
                    </p>
                  </div>

                  {/* SOP Tabs */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 p-1 bg-slate-100 rounded-2xl border border-slate-200">
                    <button
                      onClick={() => setSopTab('EXPIRED_CERT')}
                      className={`py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 ${
                        sopTab === 'EXPIRED_CERT'
                          ? 'bg-blue-600 text-white shadow-sm font-extrabold'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icons.FileWarning />
                      <span>1. Expired Certificate Protocol</span>
                    </button>
                    <button
                      onClick={() => setSopTab('EMERGENCY_CONTACTS')}
                      className={`py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 ${
                        sopTab === 'EMERGENCY_CONTACTS'
                          ? 'bg-blue-600 text-white shadow-sm font-extrabold'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icons.PhoneCall />
                      <span>2. Emergency Call Directory</span>
                    </button>
                    <button
                      onClick={() => setSopTab('HAZMAT_RULES')}
                      className={`py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 ${
                        sopTab === 'HAZMAT_RULES'
                          ? 'bg-blue-600 text-white shadow-sm font-extrabold'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icons.Scale />
                      <span>3. Hazmat & Axle Rules</span>
                    </button>
                  </div>

                  {/* Tab 1: Expired Certificate Protocol */}
                  {sopTab === 'EXPIRED_CERT' && (
                    <div className="space-y-4">
                      <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs">
                        <strong>Mandatory Plant Statutory Directive:</strong> No transport carrier with an expired
                        Pollution Under Control (PUC) certificate or suspended/inactive Registration Certificate (RC)
                        is permitted past the plant barrier under any non-emergency circumstance.
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 border border-blue-200 font-bold flex items-center justify-center text-sm font-mono">
                            1
                          </div>
                          <h4 className="font-bold text-xs text-slate-900 uppercase">Step 1: Direct to Holding Bay</h4>
                          <p className="text-[11px] text-slate-600 leading-relaxed">
                            Instruct the driver to exit the primary traffic lane immediately and park in Holding Bay #3.
                            Do not allow blocking of weighing scale sensors.
                          </p>
                        </div>

                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 font-bold flex items-center justify-center text-sm font-mono">
                            2
                          </div>
                          <h4 className="font-bold text-xs text-slate-900 uppercase">Step 2: Issue Rejection Notice</h4>
                          <p className="text-[11px] text-slate-600 leading-relaxed">
                            Provide Driver Rejection Slip (Form SF-104) citing the specific Surepass API statutory ground
                            (e.g., PUC expired on date).
                          </p>
                        </div>

                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="w-8 h-8 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 font-bold flex items-center justify-center text-sm font-mono">
                            3
                          </div>
                          <h4 className="font-bold text-xs text-slate-900 uppercase">Step 3: Escalate to Supervisor</h4>
                          <p className="text-[11px] text-slate-600 leading-relaxed">
                            If the transporter claims emergency blast furnace supply, require the Shift Incharge to enter
                            their Supervisor PIN and written justification.
                          </p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Tab 2: Emergency Contacts */}
                  {sopTab === 'EMERGENCY_CONTACTS' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                        <div>
                          <span className="text-[10px] text-rose-600 uppercase font-bold">Plant Safety Officer</span>
                          <h4 className="font-bold text-sm text-slate-900 mt-1">Er. K. Ramachandra</h4>
                          <span className="text-xs text-slate-500 font-mono mt-0.5 block">Ext: 9011 / +91 891 2519011</span>
                        </div>
                        <button
                          onClick={() => handleTriggerEmergencyCall('Plant Safety Officer', '9011')}
                          className="mt-4 w-full py-2 px-3 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs uppercase flex items-center justify-center space-x-1.5 transition active:scale-95"
                        >
                          <Icons.PhoneCall />
                          <span>Radio Safety</span>
                        </button>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                        <div>
                          <span className="text-[10px] text-blue-600 uppercase font-bold">Security Control Room</span>
                          <h4 className="font-bold text-sm text-slate-900 mt-1">Central CISF Desk</h4>
                          <span className="text-xs text-slate-500 font-mono mt-0.5 block">Ext: 8800 / +91 891 2518800</span>
                        </div>
                        <button
                          onClick={() => handleTriggerEmergencyCall('Security Control Room (CISF)', '8800')}
                          className="mt-4 w-full py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs uppercase flex items-center justify-center space-x-1.5 transition active:scale-95"
                        >
                          <Icons.PhoneCall />
                          <span>Call Security</span>
                        </button>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                        <div>
                          <span className="text-[10px] text-amber-700 uppercase font-bold">Transport Supervisor</span>
                          <h4 className="font-bold text-sm text-slate-900 mt-1">Shift Superintendent</h4>
                          <span className="text-xs text-slate-500 font-mono mt-0.5 block">Ext: 7420 / +91 891 2517420</span>
                        </div>
                        <button
                          onClick={() => handleTriggerEmergencyCall('Transport Supervisor', '7420')}
                          className="mt-4 w-full py-2 px-3 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs uppercase flex items-center justify-center space-x-1.5 transition active:scale-95"
                        >
                          <Icons.PhoneCall />
                          <span>Call Supervisor</span>
                        </button>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                        <div>
                          <span className="text-[10px] text-emerald-600 uppercase font-bold">Medical / First Aid</span>
                          <h4 className="font-bold text-sm text-slate-900 mt-1">Plant Trauma Centre</h4>
                          <span className="text-xs text-slate-500 font-mono mt-0.5 block">Ext: 108 / +91 891 2510108</span>
                        </div>
                        <button
                          onClick={() => handleTriggerEmergencyCall('Plant Medical Unit', '108')}
                          className="mt-4 w-full py-2 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase flex items-center justify-center space-x-1.5 transition active:scale-95"
                        >
                          <Icons.PhoneCall />
                          <span>Call Medical</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Tab 3: Hazmat & Axle Rules */}
                  {sopTab === 'HAZMAT_RULES' && (
                    <div className="space-y-4 text-xs">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                          <h4 className="font-bold text-xs text-blue-700 uppercase flex items-center space-x-1.5">
                            <Icons.Scale />
                            <span>Gross Vehicle Weight (GVW) Tolerances</span>
                          </h4>
                          <ul className="space-y-2 text-slate-700">
                            <li className="flex justify-between border-b border-slate-200 pb-1">
                              <span>2-Axle Rigid Truck</span>
                              <strong className="font-mono text-slate-900">Max 19.0 MT</strong>
                            </li>
                            <li className="flex justify-between border-b border-slate-200 pb-1">
                              <span>3-Axle Rigid Truck</span>
                              <strong className="font-mono text-slate-900">Max 28.0 MT</strong>
                            </li>
                            <li className="flex justify-between border-b border-slate-200 pb-1">
                              <span>4-Axle Rigid Truck</span>
                              <strong className="font-mono text-slate-900">Max 35.0 MT</strong>
                            </li>
                            <li className="flex justify-between border-b border-slate-200 pb-1">
                              <span>Multi-Axle Tractor-Trailer (Steel Coils)</span>
                              <strong className="font-mono text-slate-900">Max 49.0 - 55.0 MT</strong>
                            </li>
                          </ul>
                          <p className="text-[10px] text-amber-800 mt-1">
                            * Vehicles exceeding permitted gross weight by more than 5% must be routed to Inbound Weighbridge #2 for offloading.
                          </p>
                        </div>

                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                          <h4 className="font-bold text-xs text-amber-700 uppercase flex items-center space-x-1.5">
                            <Icons.HardHat />
                            <span>Mandatory Driver PPE Compliance</span>
                          </h4>
                          <p className="text-slate-600 text-[11px]">
                            Driver and cleaner must dismount equipped with the following before crossing the safety yellow line:
                          </p>
                          <div className="grid grid-cols-2 gap-2">
                            <div className="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center space-x-2">
                              <span>🪖</span>
                              <span className="font-semibold text-slate-800">IS 2925 Hard Hat</span>
                            </div>
                            <div className="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center space-x-2">
                              <span>🦺</span>
                              <span className="font-semibold text-slate-800">High-Vis Vest</span>
                            </div>
                            <div className="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center space-x-2">
                              <span>🥾</span>
                              <span className="font-semibold text-slate-800">Steel Toe Shoes</span>
                            </div>
                            <div className="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center space-x-2">
                              <span>👓</span>
                              <span className="font-semibold text-slate-800">Safety Goggles</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-200 py-3.5 px-6 text-center text-xs text-slate-500">
              SmeltIQ Automated Gate Entry Compliance System • Vizag Steel Operations • Surepass RC & Supabase Audit
            </footer>
          </div>

          {/* ========================================================= */}
          {/* MODAL: SUPERVISOR PIN OVERRIDE                           */}
          {/* ========================================================= */}
          {isOverrideOpen && decision && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white border border-slate-200 rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
                <div className="bg-amber-50 border-b border-amber-200 p-4 flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <div className="p-2 rounded-xl bg-amber-100 text-amber-800">
                      <Icons.KeyRound />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">Guard Override Request</h3>
                      <p className="text-[11px] text-amber-800">Supervisor PIN Authorization</p>
                    </div>
                  </div>
                  <button onClick={() => setIsOverrideOpen(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                </div>

                <form onSubmit={handleOverrideSubmit} className="p-5 space-y-3.5 text-xs">
                  <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex justify-between">
                    <span>Vehicle: <strong className="text-blue-700 font-mono">{decision.vehicle_number}</strong></span>
                    <span>Status: <strong className="text-rose-600">DENIED</strong></span>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Supervisor Master PIN</label>
                    <input
                      type="text"
                      value={overridePin}
                      onChange={(e) => setOverridePin(e.target.value)}
                      placeholder="SUPER88"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold text-amber-800 focus:bg-white"
                      required
                    />
                    <span className="text-[10px] text-slate-500 mt-0.5 block">Default demo pin: <strong>SUPER88</strong></span>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Mandatory Justification Rationale</label>
                    <textarea
                      rows={3}
                      value={overrideReason}
                      onChange={(e) => setOverrideReason(e.target.value)}
                      placeholder="e.g., Authorized emergency slag disposal vehicle cleared by Shift Incharge..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-800 focus:bg-white"
                      required
                    />
                  </div>

                  {overrideError && (
                    <div className="text-rose-700 bg-rose-50 p-2 rounded-xl border border-rose-200">
                      {overrideError}
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsOverrideOpen(false)}
                      className="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold uppercase tracking-wider shadow-sm"
                    >
                      Confirm Override
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: ADD VEHICLE TO BLACKLIST                          */}
          {/* ========================================================= */}
          {isAddBlacklistOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white border border-slate-200 rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
                <div className="bg-rose-50 border-b border-rose-200 p-4 flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <div className="p-2 rounded-xl bg-rose-100 text-rose-700">
                      <Icons.ShieldAlert />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">Add Vehicle to Blacklist</h3>
                      <p className="text-[11px] text-rose-700">Bars vehicle from all plant gates</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAddBlacklistOpen(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                </div>

                <form onSubmit={handleAddBlacklist} className="p-5 space-y-3.5 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Vehicle Registration Number</label>
                    <input
                      type="text"
                      value={newBlkPlate}
                      onChange={(e) => setNewBlkPlate(e.target.value.toUpperCase())}
                      placeholder="e.g. DL01AB1234"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold text-slate-900 uppercase focus:bg-white"
                      required
                    />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Transporter / Logistics Carrier</label>
                    <input
                      type="text"
                      value={newBlkVendor}
                      onChange={(e) => setNewBlkVendor(e.target.value)}
                      placeholder="e.g. Apex Logistics Corp"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-800 focus:bg-white"
                    />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Blacklisting Reason & Incident Report</label>
                    <textarea
                      rows={3}
                      value={newBlkReason}
                      onChange={(e) => setNewBlkReason(e.target.value)}
                      placeholder="e.g., Repeated axle overload violation; refusal to stop at weighbridge..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-800 focus:bg-white"
                      required
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAddBlacklistOpen(false)}
                      className="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold uppercase tracking-wider shadow-sm"
                    >
                      Add to Blacklist
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: SUPERVISOR OPERATIONS DESK                        */}
          {/* ========================================================= */}
          {isSupervisorDeskOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white border border-slate-200 rounded-3xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-amber-50 p-4 border-b border-amber-200 flex items-center justify-between">
                  <div className="flex items-center space-x-2.5">
                    <div className="p-2 rounded-xl bg-amber-100 text-amber-800 font-bold">⚙️</div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900 flex items-center space-x-2">
                        <span>Supervisor Operations Control Desk</span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-mono font-bold">
                          {currentUser.role}
                        </span>
                      </h3>
                      <p className="text-[11px] text-slate-600">
                        Officer: <strong>{currentUser.full_name}</strong> ({currentUser.employee_id})
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setIsSupervisorDeskOpen(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                </div>

                <div className="p-5 overflow-y-auto space-y-5 text-xs">
                  {/* Top Action Cards */}
                  <div className="grid grid-cols-2 gap-3">
                    <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                      <div>
                        <strong className="text-slate-900 block">Statutory Audit Trail Export</strong>
                        <span className="text-[10px] text-slate-500">Download {movements.length} gate logs as CSV</span>
                      </div>
                      <button
                        onClick={handleExportAuditCSV}
                        className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold transition active:scale-95 shadow-xs"
                      >
                        Export CSV
                      </button>
                    </div>
                    <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                      <div>
                        <strong className="text-slate-900 block">Supervisor Verbal PIN</strong>
                        <span className="text-[10px] text-slate-500">Master override code: <code className="text-amber-800 font-bold font-mono">SUPER88</code></span>
                      </div>
                      <span className="px-2 py-1 rounded bg-emerald-50 border border-emerald-200 text-[10px] text-emerald-700 font-bold">ACTIVE</span>
                    </div>
                  </div>

                  {/* Vendor Governance */}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <strong className="text-xs uppercase tracking-wider text-slate-800">
                        Logistics Transporter Governance (Rule 3 Active Checking)
                      </strong>
                      <span className="text-[11px] text-slate-500">
                        {vendors.filter(v => v.is_active).length} of {vendors.length} Authorized
                      </span>
                    </div>
                    <div className="rounded-xl border border-slate-200 overflow-hidden divide-y divide-slate-100 bg-white">
                      {vendors.map(v => (
                        <div key={v.id} className="p-3 flex items-center justify-between hover:bg-slate-50">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className={`w-2 h-2 rounded-full ${v.is_active ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                              <strong className="text-slate-900">{v.vendor_name}</strong>
                              <span className="text-[10px] font-mono px-1 bg-slate-100 rounded text-slate-600 border border-slate-200">{v.vendor_code}</span>
                            </div>
                            <span className="text-[10px] text-slate-500 block mt-0.5">
                              Status: {v.is_active ? 'Authorized Plant Contractor' : 'Suspended / Blacklisted from Plant'}
                            </span>
                          </div>
                          <button
                            onClick={() => handleToggleVendor(v.vendor_code)}
                            className={`px-3 py-1.5 rounded-lg font-bold text-xs transition ${
                              v.is_active
                                ? 'bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700'
                                : 'bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700'
                            }`}
                          >
                            {v.is_active ? 'Suspend Vendor' : 'Re-Authorize Vendor'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-3 bg-slate-50 border-t border-slate-200 flex justify-end">
                  <button
                    onClick={() => setIsSupervisorDeskOpen(false)}
                    className="px-4 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-xs"
                  >
                    Close Desk
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SmeltIQApp />);
  </script>
</body>
</html>
