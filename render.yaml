# ==============================================================================
# SmeltIQ Gate Entry Compliance System - Render Blueprint Specification
# ==============================================================================

services:
  # 1. FastAPI Compliance & ANPR Backend Engine
  - type: web
    name: smeltiq-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: SUREPASS_MOCK
        value: "false"
      - key: SUREPASS_BASE_URL
        value: https://api.surepass.io/api/v1
      - key: SUREPASS_API_URL
        value: https://api.surepass.io/api/v1/rc/rc-v2
      - key: SUREPASS_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://zklxevkhcgxwnpwwijal.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPERVISOR_OVERRIDE_PIN
        value: SUPER88

  # 2. React Workstation & ANPR Terminal Frontend
  - type: web
    name: smeltiq-frontend
    runtime: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smeltiq-backend
          property: host
